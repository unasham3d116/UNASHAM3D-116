/* Glitch Effect Keyframes & Styles */
.glitch-title {
    font-size: 5rem;
    font-weight: 900;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    position: relative;
    color: var(--text-color);
    text-shadow: 0.05em 0 0 rgba(255, 62, 62, 0.75),
                -0.025em -0.05em 0 rgba(0, 255, 204, 0.75),
                0.025em 0.05em 0 rgba(0, 102, 255, 0.75);
    animation: glitch-shake 500ms infinite;
}

.glitch-title::before,
.glitch-title::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: transparent;
}

.glitch-title::before {
    animation: glitch-slice-1 800ms infinite;
    left: 2px;
    text-shadow: -2px 0 var(--accent-color);
    clip-path: inset(45% 0 30% 0);
}

.glitch-title::after {
    animation: glitch-slice-2 600ms infinite;
    left: -2px;
    text-shadow: -2px 0 #00ffcc;
    clip-path: inset(10% 0 85% 0);
}

@keyframes glitch-shake {
    0% { text-shadow: 2px 4px 15px rgba(0,0,0,0.8); }
    50% { text-shadow: -1px -2px 0 rgba(255, 62, 62, 0.5), 2px 1px 0 rgba(0, 255, 204, 0.5); }
    100% { text-shadow: 2px 4px 15px rgba(0,0,0,0.8); }
}

@keyframes glitch-slice-1 {
    0% { clip-path: inset(20% 0 50% 0); }
    20% { clip-path: inset(80% 0 5% 0); }
    40% { clip-path: inset(45% 0 30% 0); }
    60% { clip-path: inset(10% 0 75% 0); }
    80% { clip-path: inset(55% 0 15% 0); }
    100% { clip-path: inset(30% 0 40% 0); }
}

@keyframes glitch-slice-2 {
    0% { clip-path: inset(15% 0 80% 0); }
    20% { clip-path: inset(40% 0 45% 0); }
    40% { clip-path: inset(70% 0 10% 0); }
    60% { clip-path: inset(5% 0 85% 0); }
    80% { clip-path: inset(90% 0 2% 0); }
    100% { clip-path: inset(25% 0 60% 0); }
}
