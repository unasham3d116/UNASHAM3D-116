/* Glitch Effect Keyframes & Styles */
.glitch-title {
    font-size: 5rem;
    font-weight: 900;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    position: relative;
    color: var(--text-color);
    text-shadow: 0.05em 0 0 rgba(255, 62, 62, 0.75),
                -0.025em -0.05em 0 rgba(0, 255, 204, 0.75),
                0.025em 0.05em 0 rgba(0, 102, 255, 0.75);
    animation: glitch-shake 500ms infinite;
}

.glitch-title::before,
.glitch-title::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: transparent;
}

.glitch-title::before {
    animation: glitch-slice-1 650ms infinite;
    left: 2px;
    text-shadow: -2px 0 var(--accent-color);
    clip-path: inset(45% 0 30% 0);
}

.glitch-title::after {
    animation: glitch-slice-2 400ms infinite;
    left: -2px;
    text-shadow: -2px 0 #00ffcc;
    clip-path: inset(10% 0 85% 0);
}

@keyframes glitch-shake {
    0% { text-shadow: 2px 4px 15px rgba(0,0,0,0.8); }
    50% { text-shadow: -1px -2px 0 rgba(255, 62, 62, 0.5), 2px 1px 0 rgba(0, 255, 204, 0.5); }
    100% { text-shadow: 2px 4px 15px rgba(0,0,0,0.8); }
}

@keyframes glitch-slice-1 {
    0% { clip-path: inset(20% 0 50% 0); }
    20% { clip-path: inset(80% 0 5% 0); }
    40% { clip-path: inset(45% 0 30% 0); }
    60% { clip-path: inset(10% 0 75% 0); }
    80% { clip-path: inset(55% 0 15% 0); }
    100% { clip-path: inset(30% 0 40% 0); }
}

@keyframes glitch-slice-2 {
    0% { clip-path: inset(15% 0 80% 0); }
    20% { clip-path: inset(40% 0 45% 0); }
    40% { clip-path: inset(70% 0 10% 0); }
    60% { clip-path: inset(5% 0 85% 0); }
    80% { clip-path: inset(90% 0 2% 0); }
    100% { clip-path: inset(25% 0 60% 0); }
}

<!-- Firebase SDK Modules -->
<script type="module">
  // Import the necessary functions from the Firebase CDN links
import { initializeApp } from "https://gstatic.com";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://gstatic.com";

import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBhhn5zwTIASHyWFXybqEYQ80Zs6Rwbau0",
  authDomain: "unasham3d116.firebaseapp.com",
  projectId: "unasham3d116",
  storageBucket: "unasham3d116.firebasestorage.app",
  messagingSenderId: "65072384449",
  appId: "1:65072384449:web:725278fba3bb456dc08740",
  measurementId: "G-89TF5K7TXN"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);


  // Initialize Firebase and Firestore Database
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const messagesCollection = collection(db, "testimony_wall");

  // Grab HTML elements
  const guestForm = document.getElementById('guestbook-form');
  const messageBoard = document.getElementById('message-board');

  // 2. Listen for Live Updates from Firebase (Real-time sync!)
  // This automatically runs whenever ANYONE in the world posts a new message
  const q = query(messagesCollection, orderBy("timestamp", "desc"));
  onSnapshot(q, (snapshot) => {
    // Clear the board first so we don't duplicate items
    messageBoard.innerHTML = '';
    
    snapshot.forEach((doc) => {
      const data = doc.data();
      renderPost(data.name, data.message);
    });
  });

  // 3. Handle Form Submission to Firebase Cloud
  guestForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const nameInput = document.getElementById('guest-name');
    const messageInput = document.getElementById('guest-message');
    const name = nameInput.value.trim();
    const message = messageInput.value.trim();

    if (name && message) {
      try {
        // Send data straight to your Firestore collection securely
        await addDoc(messagesCollection, {
          name: name,
          message: message,
          timestamp: serverTimestamp() // Tracks exact order of posts
        });
        
        // Reset the form input spaces
        guestForm.reset();
      } catch (error) {
        console.error("Error adding document: ", error);
        alert("Something went wrong saving your message. Check console.");
      }
    }
  });

  // Helper function to turn text data into structured HTML elements
  function renderPost(name, message) {
    const card = document.createElement('div');
    card.classList.add('post-card');
    card.innerHTML = `
        <p class="post-text">"${message}"</p>
        <div class="post-author">— ${name}</div>
    `;
    messageBoard.appendChild(card);
  }
</script>
